<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Here I Am · 안심 위치 모니터링 대시보드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.07), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 24px;
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--success-soft);
      color: #047857;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-subtle); border-color: #cbd5e1; }
    .btn-soft {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-soft:hover { background: #dbeafe; }

    .container {
      max-width: 1280px;
      margin: 22px auto 40px;
      padding: 0 20px;
      display: grid;
      gap: 20px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 820px) {
      .summary-grid { grid-template-columns: 1fr; }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .kpi-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon.blue { background: #eff6ff; color: #2563eb; }
    .kpi-icon.green { background: #ecfdf5; color: #059669; }
    .kpi-icon.amber { background: #fffbeb; color: #d97706; }
    .kpi-label { font-size: 0.78rem; font-weight: 600; color: var(--text-sub); margin-bottom: 3px; }
    .kpi-value { font-size: 1.05rem; font-weight: 700; color: var(--text-main); word-break: keep-all; }
    .kpi-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .settings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .settings-header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: var(--surface);
    }
    .settings-header:hover { background: var(--surface-subtle); }
    .settings-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-body {
      padding: 0 20px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: grid;
      gap: 12px;
    }
    .settings-body.hidden { display: none; }
    .config-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 14px;
    }
    @media (max-width: 860px) {
      .config-grid { grid-template-columns: 1fr; }
    }
    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.86rem;
      background: #fff;
      transition: border-color 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.05fr 1.25fr;
      gap: 20px;
      align-items: stretch;
    }
    @media (max-width: 980px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .map-wrapper {
      position: relative;
      flex: 1;
      min-height: 490px;
    }
    #map {
      width: 100%;
      height: 100%;
      min-height: 490px;
      z-index: 1;
    }
    .map-overlay-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 500;
      background: #fff;
      color: var(--text-main);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .filter-bar {
      padding: 12px 20px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      background: transparent;
      color: var(--text-sub);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .search-box {
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      width: 190px;
      background: #fff;
    }

    .log-list {
      max-height: 450px;
      overflow-y: auto;
    }
    .log-item {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 118px 1fr auto;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: background 0.14s ease;
    }
    .log-item:hover { background: #f8fafc; }
    .log-item.selected {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding-left: 16px;
    }
    @media (max-width: 560px) {
      .log-item { grid-template-columns: 1fr; gap: 6px; }
    }
    .time-col {
      display: flex;
      flex-direction: column;
    }
    .date-text {
      font-size: 0.76rem;
      color: var(--text-sub);
      font-weight: 500;
    }
    .clock-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .loc-col { min-width: 0; }
    .loc-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-btn { background: #dcfce7; color: #15803d; }
    .badge-req { background: #dbeafe; color: #1d4ed8; }
    .badge-latest { background: #fef3c7; color: #b45309; }
    .place-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .place-addr {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coord-text {
      font-family: monospace;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .action-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .gmap-btn {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 8px;
      text-decoration: none;
      white-space: nowrap;
    }
    .gmap-btn:hover { background: #dbeafe; }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <div>
          <div class="brand-title">
            Here I Am
            <span class="live-pill"><span class="live-dot"></span>보호자 모니터링</span>
          </div>
          <div class="brand-sub">ESP32 양방향 GPS 안심 위치·시간 이력 대시보드</div>
        </div>
      </div>

      <div class="nav-actions">
        <button class="btn-secondary" onclick="fetchSheetLogs()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          새로고침
        </button>
        <button class="btn-soft" onclick="exportCSV()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          엑셀(CSV) 저장
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="summary-grid">
      <div class="kpi-card">
        <div class="kpi-icon blue">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <div class="kpi-label">최근 확인된 위치</div>
          <div class="kpi-value" id="kpiLatestPlace">기록 대기 중</div>
          <div class="kpi-meta" id="kpiLatestAddr">연동 후 자동 표시됩니다</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon green">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div>
          <div class="kpi-label">최근 수신 일시</div>
          <div class="kpi-value" id="kpiLatestTime">-</div>
          <div class="kpi-meta" id="kpiLatestSource">수신 구분 대기 중</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon amber">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </div>
        <div>
          <div class="kpi-label">누적 위치 기록</div>
          <div class="kpi-value" id="kpiTotalCount">총 0건</div>
          <div class="kpi-meta" id="syncStatusText">클라우드 시트 연결 대기</div>
        </div>
      </div>
    </section>

    <section class="settings-panel">
      <div class="settings-header" onclick="toggleSettings()">
        <div class="settings-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          데이터 연동 설정 (Google 스프레드시트 웹 앱 URL)
        </div>
        <span id="settingsToggleLabel" style="font-size:0.78rem; color:#64748b;">접기 ▲</span>
      </div>
      <div class="settings-body" id="settingsBody">
        <div class="config-grid">
          <div class="field">
            <label>Google Apps Script 웹 앱 URL</label>
            <input type="text" id="scriptUrl" />
          </div>
          <div class="field">
            <label>Google Maps API Key (선택 · 주변 정밀 상호명용)</label>
            <input type="password" id="gmapsKey" placeholder="미입력 시 무료 한국어 상호·주소 조회" />
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn-primary" onclick="saveAndLoad()">연결 및 불러오기</button>
            <button class="btn-secondary" onclick="loadSample()">샘플 데이터</button>
          </div>
        </div>
      </div>
    </section>

    <section class="dashboard-grid">
      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">실시간 이동 경로 지도</div>
            <div class="panel-sub">마커를 클릭하면 상세 시간과 구글맵 링크를 볼 수 있습니다</div>
          </div>
        </div>
        <div class="map-wrapper">
          <div id="map"></div>
          <button class="map-overlay-btn" onclick="fitAllMarkers()">전체 경로 한눈에 보기</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">위치 및 시간 상세 이력</div>
            <div class="panel-sub">년-월-일 · 시각 · 주변 상호명 · 도로명주소</div>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-tabs">
            <button class="tab-btn active" onclick="setFilter('ALL', this)">전체</button>
            <button class="tab-btn" onclick="setFilter('BTN', this)">버튼 호출</button>
            <button class="tab-btn" onclick="setFilter('REQ', this)">원격 조회</button>
          </div>
          <input type="text" class="search-box" id="searchInput" placeholder="상호명, 주소, 날짜 검색..." oninput="renderList()" />
        </div>

        <div class="log-list" id="logList">
          <div class="empty-state">
            위치 기록을 불러오는 중입니다...
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2NhkhkI1-ccS6AHv-7aZnBBUHtn5xAJcpcj_ywYGvr-1Gi13FNNXrIM2Q5MlGQpXM/exec";
    const URL_KEY = "here_i_am_gas_url_v4";
    const GMAP_KEY = "here_i_am_gmap_key_v4";
    const GEO_CACHE_KEY = "here_i_am_geo_cache_v4";

    let allLogs = [];
    let currentFilter = "ALL";
    let selectedIndex = -1;
    let geoCache = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "{}");
    let map, markerGroup, polyline, boundsGroup;

    function initMap() {
      map = L.map("map").setView([35.1667, 128.9961], 14);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }).addTo(map);
      markerGroup = L.layerGroup().addTo(map);

      const savedUrl = localStorage.getItem(URL_KEY) || DEFAULT_SCRIPT_URL;
      const savedGmap = localStorage.getItem(GMAP_KEY) || "";
      document.getElementById("scriptUrl").value = savedUrl;
      document.getElementById("gmapsKey").value = savedGmap;

      if (savedUrl) {
        toggleSettings(true);
        fetchSheetLogs();
      }
    }

    function toggleSettings(forceClose = false) {
      const body = document.getElementById("settingsBody");
      const label = document.getElementById("settingsToggleLabel");
      if (forceClose || !body.classList.contains("hidden")) {
        body.classList.add("hidden");
        label.textContent = "펼치기 ▼";
      } else {
        body.classList.remove("hidden");
        label.textContent = "접기 ▲";
      }
    }

    async function resolvePlaceName(lat, lng) {
      const cacheKey = `${lat.toFixed(5)},${lng.toFixed(5)}`;
      if (geoCache[cacheKey]) return geoCache[cacheKey];

      const gmapsKey = document.getElementById("gmapsKey").value.trim();
      if (gmapsKey) {
        try {
          const nearbyUrl = `https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=${lat},${lng}&radius=50&language=ko&key=${gmapsKey}`;
          const res = await fetch(nearbyUrl);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const poi = data.results.find(p => !p.types.includes("political")) || data.results[0];
            const result = { placeName: poi.name, address: poi.vicinity || "" };
            geoCache[cacheKey] = result;
            localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geoCache));
            return result;
          }
        } catch (e) {}
      }

      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ko`;
        const res = await fetch(url);
        const data = await res.json();
        const addr = data.address || {};
        const poiName = data.name || addr.amenity || addr.shop || addr.building || addr.school || addr.hospital || addr.road || "위치 확인됨";
        const roadAddr = [addr.city || addr.county, addr.borough || addr.suburb, addr.road, addr.house_number]
          .filter(Boolean).join(" ");
        const result = { placeName: poiName, address: roadAddr || data.display_name || "" };
        geoCache[cacheKey] = result;
        localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geoCache));
        return result;
      } catch (e) {
        return { placeName: "위치 확인됨", address: `${lat.toFixed(5)}, ${lng.toFixed(5)}` };
      }
    }

    function saveAndLoad() {
      const url = document.getElementById("scriptUrl").value.trim();
      const gmap = document.getElementById("gmapsKey").value.trim();
      if (!url) return alert("Google Apps Script 웹 앱 URL을 입력해 주세요.");
      localStorage.setItem(URL_KEY, url);
      localStorage.setItem(GMAP_KEY, gmap);
      fetchSheetLogs();
    }

    async function fetchSheetLogs() {
      const url = document.getElementById("scriptUrl").value.trim() || DEFAULT_SCRIPT_URL;
      const statusEl = document.getElementById("syncStatusText");
      if (!url) {
        toggleSettings(false);
        return;
      }

      statusEl.textContent = "데이터 동기화 중...";
      statusEl.style.color = "#2563eb";

      try {
        const res = await fetch(url);
        const rows = await res.json();

        allLogs = [];
        for (const r of rows) {
          const lat = parseFloat(r.lat);
          const lng = parseFloat(r.lng);
          if (isNaN(lat) || isNaN(lng)) continue;
          const geo = await resolvePlaceName(lat, lng);
          allLogs.push({
            date: String(r.date || "").slice(0, 10),
            time: String(r.time || ""),
            source: r.source || "위치 전송",
            lat,
            lng,
            placeName: geo.placeName,
            address: geo.address
          });
        }

        allLogs.sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));
        updateDashboard();
        statusEl.textContent = `동기화 완료 (${new Date().toTimeString().slice(0,5)} 기준)`;
        statusEl.style.color = "#059669";
      } catch (err) {
        statusEl.textContent = "연결 오류 (웹 앱 URL 및 배포 권한 확인)";
        statusEl.style.color = "#dc2626";
      }
    }

    async function loadSample() {
      const statusEl = document.getElementById("syncStatusText");
      statusEl.textContent = "샘플 위치 변환 중...";
      const samples = [
        { date: "2026-11-20", time: "14:01:10", source: "버튼 호출", lat: 35.16675, lng: 128.99615 },
        { date: "2026-11-20", time: "13:20:42", source: "텔레그램 요청", lat: 35.16285, lng: 128.98542 },
        { date: "2026-11-19", time: "18:05:19", source: "버튼 호출", lat: 35.15782, lng: 129.05915 }
      ];
      allLogs = [];
      for (const s of samples) {
        const geo = await resolvePlaceName(s.lat, s.lng);
        allLogs.push({ ...s, placeName: geo.placeName, address: geo.address });
      }
      updateDashboard();
      statusEl.textContent = "샘플 데이터 미리보기 중";
      statusEl.style.color = "#059669";
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderList();
    }

    function updateDashboard() {
      document.getElementById("kpiTotalCount").textContent = `총 ${allLogs.length}건`;
      if (allLogs.length > 0) {
        const latest = allLogs[0];
        document.getElementById("kpiLatestPlace").textContent = latest.placeName;
        document.getElementById("kpiLatestAddr").textContent = latest.address || `${latest.lat.toFixed(5)}, ${latest.lng.toFixed(5)}`;
        document.getElementById("kpiLatestTime").textContent = `${latest.date} ${latest.time}`;
        document.getElementById("kpiLatestSource").textContent = `수신 방식: ${latest.source}`;
      } else {
        document.getElementById("kpiLatestPlace").textContent = "기록 없음";
        document.getElementById("kpiLatestAddr").textContent = "아직 전송된 위치 기록이 없습니다";
        document.getElementById("kpiLatestTime").textContent = "-";
        document.getElementById("kpiLatestSource").textContent = "-";
      }

      renderMap();
      renderList();
    }

    function renderMap() {
      markerGroup.clearLayers();
      if (polyline) map.removeLayer(polyline);
      boundsGroup = [];

      allLogs.forEach((item, idx) => {
        const isLatest = idx === 0;
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        const markerHtml = `<div style="
          width:${isLatest ? 18 : 13}px;
          height:${isLatest ? 18 : 13}px;
          background:${isLatest ? '#ef4444' : '#2563eb'};
          border:3px solid #fff;
          border-radius:50%;
          box-shadow:0 2px 6px rgba(0,0,0,0.35);
        "></div>`;

        const customIcon = L.divIcon({
          html: markerHtml,
          className: "",
          iconSize: [isLatest ? 18 : 13, isLatest ? 18 : 13],
          iconAnchor: [isLatest ? 9 : 6.5, isLatest ? 9 : 6.5]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).bindPopup(`
          <div style="font-family:'Noto Sans KR',sans-serif; min-width:170px;">
            <div style="font-weight:700; font-size:13px; margin-bottom:2px;">${item.placeName}</div>
            <div style="font-size:11px; color:#64748b; margin-bottom:6px;">${item.date} ${item.time} · ${item.source}</div>
            <a href="${gmapUrl}" target="_blank" style="font-size:11px; color:#2563eb; font-weight:600; text-decoration:none;">구글맵에서 주변 상호 보기 ↗</a>
          </div>
        `);
        markerGroup.addLayer(marker);
        boundsGroup.push([item.lat, item.lng]);
      });

      if (boundsGroup.length > 0) {
        polyline = L.polyline(boundsGroup, { color: "#2563eb", weight: 3, opacity: 0.65, dashArray: "6, 6" }).addTo(map);
        fitAllMarkers();
      }
    }

    function fitAllMarkers() {
      if (boundsGroup && boundsGroup.length > 0) {
        map.fitBounds(L.latLngBounds(boundsGroup), { padding: [36, 36], maxZoom: 16 });
      }
    }

    function renderList() {
      const listEl = document.getElementById("logList");
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = allLogs.filter(item => {
        if (currentFilter === "BTN" && !item.source.includes("버튼")) return false;
        if (currentFilter === "REQ" && item.source.includes("버튼")) return false;
        if (keyword) {
          const hay = `${item.date} ${item.time} ${item.placeName} ${item.address}`.toLowerCase();
          if (!hay.includes(keyword)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">조건에 일치하는 위치 기록이 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = "";
      filtered.forEach((item, idx) => {
        const isBtn = item.source.includes("버튼");
        const isLatest = (item === allLogs[0]);
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;

        const row = document.createElement("div");
        row.className = "log-item" + (selectedIndex === idx ? " selected" : "");
        row.innerHTML = `
          <div class="time-col">
            <span class="date-text">${item.date}</span>
            <span class="clock-text">${item.time}</span>
          </div>
          <div class="loc-col">
            <div class="loc-header">
              ${isLatest ? '<span class="badge badge-latest">최신</span>' : ''}
              <span class="badge ${isBtn ? 'badge-btn' : 'badge-req'}">${item.source}</span>
              <span class="place-title">${item.placeName}</span>
            </div>
            <div class="place-addr">${item.address}</div>
            <div class="coord-text">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</div>
          </div>
          <div class="action-col">
            <a class="gmap-btn" href="${gmapUrl}" target="_blank" onclick="event.stopPropagation()">구글맵 ↗</a>
          </div>
        `;
        row.onclick = () => {
          selectedIndex = idx;
          renderList();
          map.setView([item.lat, item.lng], 17);
        };
        listEl.appendChild(row);
      });
    }

    function exportCSV() {
      if (allLogs.length === 0) return alert("내보낼 위치 데이터가 없습니다.");
      let csv = "\uFEFF년-월-일,시간,구분,위치명(상호),상세주소,위도,경도,구글맵링크\n";
      allLogs.forEach(l => {
        const link = `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
        csv += `"${l.date}","${l.time}","${l.source}","${l.placeName}","${l.address}",${l.lat},${l.lng},"${link}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `HereIAm_위치이력_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    window.onload = initMap;
  </script>
</body>
